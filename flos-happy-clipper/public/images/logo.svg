<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="fhcLogoTitle">
  <title id="fhcLogoTitle">Flo's Happy Clipper</title>

  <!-- Outer sky-blue ring -->
  <circle cx="110" cy="98" r="82" fill="#9ed3ea" />
  <circle cx="110" cy="98" r="74" fill="#fdf5ea" />

  <!-- Navy scalloped ring -->
  <circle cx="110" cy="98" r="68" fill="none" stroke="#22305c" stroke-width="10" stroke-dasharray="6 7" />
  <circle cx="110" cy="98" r="68" fill="#22305c" opacity="0" />

  <!-- Pink center -->
  <circle cx="110" cy="98" r="60" fill="#f3b8ce" />
  <circle cx="110" cy="98" r="60" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- Poodle -->
  <g fill="#ffffff" stroke="#22305c" stroke-width="2.5" stroke-linejoin="round">
    <!-- ears -->
    <ellipse cx="86" cy="78" rx="15" ry="19" transform="rotate(-18 86 78)" />
    <ellipse cx="134" cy="78" rx="15" ry="19" transform="rotate(18 134 78)" />
    <!-- head pompom -->
    <circle cx="110" cy="70" r="26" />
    <!-- body -->
    <ellipse cx="110" cy="118" rx="26" ry="24" />
    <!-- leg poofs -->
    <circle cx="92" cy="140" r="8" />
    <circle cx="104" cy="144" r="8" />
    <circle cx="118" cy="144" r="8" />
    <circle cx="130" cy="140" r="8" />
    <!-- tail poof -->
    <circle cx="140" cy="106" r="9" />
  </g>
  <!-- face -->
  <circle cx="102" cy="68" r="2.6" fill="#22305c" />
  <circle cx="118" cy="68" r="2.6" fill="#22305c" />
  <path d="M108 76c1 2 3 2 4 0" fill="none" stroke="#22305c" stroke-width="2" stroke-linecap="round" />
  <path d="M110 78v4" fill="none" stroke="#22305c" stroke-width="2" stroke-linecap="round" />

  <!-- Ribbon banners -->
  <path d="M6 132 L44 120 L50 138 L52 156 L14 168 Z" fill="#9ed3ea" stroke="#22305c" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M214 132 L176 120 L170 138 L168 156 L206 168 Z" fill="#9ed3ea" stroke="#22305c" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Text ribbon -->
  <path d="M18 168 Q110 196 202 168 L202 182 Q110 210 18 182 Z" fill="#ffffff" stroke="#22305c" stroke-width="2.5" stroke-linejoin="round" />
  <text x="110" y="188" text-anchor="middle" font-family="'Baloo 2','Fredoka',ui-rounded,sans-serif" font-weight="700" font-size="18" fill="#22305c">Flo's Happy Clipper</text>

  <!-- leaf accents -->
  <path d="M14 172c4-6 10-6 13-2-4 5-10 6-13 2z" fill="#8bc48a" stroke="#22305c" stroke-width="1.2" />
  <path d="M206 172c-4-6-10-6-13-2 4 5 10 6 13 2z" fill="#8bc48a" stroke="#22305c" stroke-width="1.2" />
</svg>
